[project]
name = "suj"
version = "0.1.0"
description = "Integração experimental e não oficial com serviços do jus.br para pesquisa acadêmica"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Franklin Baldo" }]
dependencies = [
    "fastmcp>=3.4.5,<4",
    "httpx",
    "keyring",
    "pydantic>=2",
    "pydantic-settings",
]

[project.scripts]
suj = "suj.server:main"

[dependency-groups]
dev = [
    "bandit",
    "okf-parser @ git+https://github.com/franklinbaldo/okf-parser@8cf97286868aafd8fbda8e82f7b32bf342324fdd",
    "pip-audit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "ty",
    "vulture",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["suj"]
omit = ["src/suj/server.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
